# Cloudflare Workers Static Assets with canonical URL redirects
name = "flatfeehomesexchange-com-v1"
compatibility_date = "2026-08-11"
main = "src/worker.ts"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
# Disable Cloudflare HTML redirects (/index.html→/, /404.html→/404) that
# Search Console reports as "Page with redirect". The Worker serves "/" from
# index.html and returns a real 404 for the 404 document paths.
html_handling = "none"
not_found_handling = "404-page"

[[routes]]
pattern = "flatfeehomesexchange.com"
custom_domain = true

[[routes]]
pattern = "www.flatfeehomesexchange.com"
custom_domain = true
